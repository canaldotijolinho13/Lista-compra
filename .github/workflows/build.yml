name: gerar-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash setup.sh
      - name: Incluir ajustes
        run: |
          cat app/src/main/assets/p5.txt >> app/src/main/assets/index.html
          cat app/src/main/assets/p6.txt >> app/src/main/assets/index.html
          cat app/src/main/assets/p7.txt >> app/src/main/assets/index.html
          cat app/src/main/assets/p8.txt >> app/src/main/assets/index.html
          sed -i 's|<title>Lista de compras</title>|<title>Minha Lista de Compras</title>|' app/src/main/assets/index.html
          sed -i 's|<h1>Lista de compras</h1>|<h1>Minha Lista de Compras</h1>|' app/src/main/assets/index.html
          sed -i 's|android:label="Lista de compras"|android:label="Minha Lista de Compras"|' app/src/main/AndroidManifest.xml
      - name: Preparar chave de assinatura
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -keystore keystore.jks -alias lista -keyalg RSA -keysize 2048 -validity 10000 -storepass lista123 -keypass lista123 -dname "CN=Phillip Almeida, O=Lista, C=BR"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add keystore.jks
            git commit -m "chave de assinatura [skip ci]"
            git push
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
