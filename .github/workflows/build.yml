name: gerar-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash setup.sh
      - name: Corrigir linha truncada
        run: |
          F=app/src/main/java/br/com/lista/MainActivity.kt
          sed -i 's/put(MediaStore.MediaColumns.RELATIVE_PATH.*/put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)\n                        }/' "$F"
          grep -n -A2 "RELATIVE_PATH" "$F"
      - name: Incluir ajustes
        run: |
          cat app/src/main/assets/p5.txt >> app/src/main/assets/index.html
          cat app/src/main/assets/p6.txt >> app/src/main/assets/index.html
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
